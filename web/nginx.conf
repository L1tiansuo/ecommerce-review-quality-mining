server {listen 80; server_name _; root /usr/share/nginx/html; client_max_body_size 50m; location / { try_files $uri $uri/ /index.html; } location /api/ { proxy_pass http://backend:8080; proxy_read_timeout 180s; } location /swagger-ui { proxy_pass http://backend:8080; } location /v3/ {proxy_pass http://backend:8080;} }
