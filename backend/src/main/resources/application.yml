server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./runtime/qr;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
qr:
  algo: ${ALGO_URL:http://localhost:8001}
  seed: ${SEED_DIR:../data/seed}
  jwt-secret: ${JWT_SECRET:local-development-only-change-this-secret-32chars}
  password: ${ADMIN_PASSWORD:QrDemo2026!}
